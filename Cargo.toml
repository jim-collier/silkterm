# Virtual workspace: the crate lives in source/ (Cargo.toml + src/ + diagnostics/).
# Build/test/run from this root as before; Cargo.lock and target/ stay here.
[workspace]
members = ["source"]
resolver = "3"

# Five changes over the released 0.26.0, on one branch. At each new release,
# move them onto a new branch named for it, and leave this one standing so an
# older lock still resolves.
#
# The scroll ledger: the engine records every region scroll (count, region,
# and the rows that left the screen) so the alt-screen slide can ease off an
# exact record instead of a guess. That is what lets tmux scroll smoothly.
#
# On Windows the terminal froze for good on any large burst of output: the
# engine's reader thread fills a one-megabyte staging buffer and waits for room,
# while the side that consumes it is told there is data only as a side effect of
# writing into that same buffer. Once it is full there can be no further write,
# so nothing is left to tell anyone, and both ends wait forever at no CPU. It
# needs only enough output to fill the buffer, so it was reachable by ordinary
# use and nothing about our own code was involved.
#
# That one went upstream as alacritty/alacritty#9026 and was closed unmerged.
# The branch is cut from the v0.17.0 tag rather than master purely so the
# version still reads 0.26.0 - cargo silently ignores a patch whose version does
# not satisfy the dependency requirement, and master carries a pre-release
# version that does not.
#
# The cap of nine combining marks per cell is upstream's own fix (ede2ac144d),
# here until a release has it. The last three are ours. On Linux, a program that
# closes its terminal and keeps running no longer spins the reader thread at a
# whole core; the PTY is left out of the poll for a tenth of a second at a time.
# A title is cut to 2 KiB, so the title stack cannot be made to hold gigabytes.
# And on Windows a pane gives back its process, thread and pipe handles when it
# closes, and a program path with a space is quoted, so a planted program
# earlier in that path cannot run in its place.
[patch.crates-io]
alacritty_terminal = { git = "https://github.com/jim-collier/alacritty", branch = "scroll-ledger-0.26.0" }

# x11-clipboard 0.9.3 drops the copied text on ANY SelectionClear, without
# checking when that clear was generated. One left over from an earlier
# hand-over arrives after the next copy has already taken the selection back,
# and wipes the text that copy just stored - so the selection stays ours with
# nothing behind it, and a program asking to paste gets no reply at all. Our
# branch keeps the value; it is never served while another program owns the
# selection, and the next copy overwrites it. The branch is the published
# 0.9.3 plus that one change and a test for it.
x11-clipboard = { git = "https://github.com/jim-collier/x11-clipboard", branch = "keep-value-on-clear-0.9.3" }

# Clippy gate (cicd lints stage runs -D warnings). pedantic is on; the allows
# below are deliberate house style, not suppressed problems.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Shaped by wgpu/winit API reality or plain readability here.
collapsible_if = "allow"        # nested ifs read better than && chains here
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

# Pixel/grid/easing math casts and exact sentinel float compares are pervasive
# and intentional. Rewriting each site (try_from().unwrap(), From, epsilon
# compares) adds noise, not clarity - where an epsilon is meant, the code uses
# an explicit one (SETTLE_EPS).
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
float_cmp = "allow"

# Big render/build/layout fns are cohesive; splitting for a line count alone
# would scatter tightly-coupled state.
too_many_lines = "allow"

# Config/Settings-style structs legitimately carry many independent toggles.
struct_excessive_bools = "allow"

# `..Default::default()` in struct-update reads better than naming the type.
default_trait_access = "allow"

# A function-scoped `use Enum::*` right before an exhaustive match reads better
# than a 30-variant explicit import list.
enum_glob_use = "allow"

# Color/geometry math uses the conventional short names (r/g/b, x/y/w/h, sx/sy);
# spelling them out fights the domain and the project's own naming style.
similar_names = "allow"
many_single_char_names = "allow"

# CLI optional-value args are a genuine tri-state: absent / present-empty /
# present-with-value. Option<Option<T>> models that directly.
option_option = "allow"

# Profiles only take effect in the workspace root manifest, so they live here,
# not in source/Cargo.toml.

# Balance size and runtime speed. Measured 2026-07-31 (termbench ingest score /
# paced-output CPU / binary size): "3" = 65.3 / 28.5k jiffies / 13.65MB,
# "s" = 65.2 / 27.3k / 10.68MB, "z" = 35.4 / - / 10.06MB. "s" ties "3" on speed
# (slightly cheaper CPU - icache) and is 22% smaller; "z" halves throughput.
# NOTE: do NOT pack with UPX/etc - packers routinely trip antivirus heuristics.
[profile.release]
opt-level = "s"      # speed-parity with 3 here, 22% smaller (see above)
lto = "fat"          # whole-program inlining: usually smaller AND faster than thin
codegen-units = 1    # better cross-module optimization (also a bit smaller)
panic = "abort"      # drop unwinding tables - sizable shrink, fine for a GUI app
strip = true         # strip symbols

# Full debuginfo makes the debug binary ~285M and target/debug multi-GB. We debug
# via panic backtraces + eprintln, not a variable-inspecting debugger, so keep
# line tables (file:line in backtraces) and drop the rest. Set debug=true if you
# ever need full gdb/lldb. No effect on rebuild speed.
[profile.dev]
debug = "line-tables-only"

# Used only by the cicd profiler stage (cargo build --profile profiling
# --features profiling). Optimized like release so the flamegraph reflects real
# perf, but keeps symbols + debuginfo (release strips them) so frames are named.
[profile.profiling]
inherits = "release"
strip = false
debug = true
